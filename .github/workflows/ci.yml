name: Continuous Integration

on:
  push:
    branches:
      - develop
      - preview
      - production
      - "feature/**"

  pull_request:
    branches:
      - develop
      - preview
      - production

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show npm Cache Location
        run: npm config get cache

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
  test: 
    name: Test 
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7 
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0


      - name: Show npm Cache Location
        run: npm config get cache 
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Tests
        run: npm run test:coverage 
  build: 
    name: Build 
    runs-on: ubuntu-latest
    needs: test
    
    steps: 
      - name: Checkout Repository
        uses: actions/Checkout@v7
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        
      - name: Show npm Cache Location 
        run: npm config get cache
        
      - name: Install Dependencies 
        run: npm ci
      
      - name: Build Project
        run: npm run build 
      
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vite-build
          path: dist/
          if-no-files-found: error
          retention-days: 7